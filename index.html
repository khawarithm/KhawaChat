<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KhawaChat - Chat Modern</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: white;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  position: fixed;
  top: 0;
  left: 0;
  background: #0a0a14;
}

/* === BACKGROUND ANIMATION === */
.bg-animation {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  animation: float 8s ease-in-out infinite;
}

.bg-orb:nth-child(1) {
  width: 300px;
  height: 300px;
  background: #667eea;
  top: 10%;
  left: 20%;
  animation-delay: 0s;
}

.bg-orb:nth-child(2) {
  width: 250px;
  height: 250px;
  background: #764ba2;
  top: 50%;
  right: 15%;
  animation-delay: -3s;
}

.bg-orb:nth-child(3) {
  width: 200px;
  height: 200px;
  background: #e040fb;
  bottom: 20%;
  left: 40%;
  animation-delay: -6s;
}

.bg-orb:nth-child(4) {
  width: 350px;
  height: 350px;
  background: #00bcd4;
  top: 30%;
  right: 30%;
  animation-delay: -4s;
  opacity: 0.3;
}

@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.1); }
}

.bg-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridMove 20s linear infinite;
}

@keyframes gridMove {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-60px, -60px); }
}

/* === LOGIN PAGE === */
#authPage {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  padding: 20px;
  position: relative;
  z-index: 1;
}

.auth-card {
  background: rgba(20, 20, 40, 0.8);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  padding: 40px 30px;
  width: 100%;
  max-width: 420px;
  box-shadow: 
    0 30px 60px rgba(0, 0, 0, 0.5),
    0 0 80px rgba(102, 126, 234, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  animation: fadeInUp 0.8s ease;
}

.auth-card::before {
  content: '';
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  background: linear-gradient(45deg, #667eea, #764ba2, #e040fb, #00bcd4);
  border-radius: 26px;
  z-index: -1;
  opacity: 0.3;
  animation: borderGlow 4s linear infinite;
}

@keyframes borderGlow {
  0% { opacity: 0.2; }
  50% { opacity: 0.5; }
  100% { opacity: 0.2; }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.auth-logo {
  text-align: center;
  margin-bottom: 10px;
  font-size: 50px;
  animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.auth-card h2 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 4px;
  font-weight: 800;
  background: linear-gradient(135deg, #667eea, #e040fb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-card .subtitle {
  text-align: center;
  color: #999;
  margin-bottom: 30px;
  font-size: 14px;
  letter-spacing: 1px;
}

.input-group {
  position: relative;
  margin: 12px 0;
}

.input-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  z-index: 2;
}

.auth-input {
  width: 100%;
  padding: 14px 18px 14px 48px;
  margin: 0;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  color: white;
  font-size: 15px;
  transition: all 0.3s;
  outline: none;
}

.auth-input:focus {
  border-color: #667eea;
  box-shadow: 0 0 25px rgba(102, 126, 234, 0.25);
  background: rgba(255, 255, 255, 0.08);
}

.auth-input::placeholder {
  color: #555;
}

.auth-btn {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
}

.btn-primary:active {
  transform: translateY(-1px);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  color: #ccc;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
  color: white;
}

.auth-divider {
  display: flex;
  align-items: center;
  margin: 20px 0;
  color: #555;
  font-size: 12px;
}

.auth-divider::before,
.auth-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.1);
}

.auth-divider span {
  padding: 0 15px;
}

/* === PROFILE SETUP === */
#profileSetup {
  display: none;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  padding: 20px;
  position: relative;
  z-index: 1;
}

.profile-card {
  background: rgba(20, 20, 40, 0.8);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  padding: 35px 30px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
  position: relative;
}

.profile-card h2 {
  text-align: center;
  margin-bottom: 25px;
  font-size: 26px;
  background: linear-gradient(135deg, #667eea, #e040fb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.file-upload {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  background: rgba(255, 255, 255, 0.04);
  border: 1px dashed rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  color: #888;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s;
  font-size: 14px;
}

.file-upload:hover {
  border-color: #667eea;
  color: #667eea;
  background: rgba(102, 126, 234, 0.05);
}

/* === MAIN APP === */
#app {
  display: none;
  height: 100vh;
  width: 100vw;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1;
}

.container {
  display: flex;
  width: 100%;
  height: 100%;
  position: relative;
}

/* === SIDEBAR === */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 330px;
  max-width: 85vw;
  height: 100vh;
  background: rgba(10, 10, 24, 0.98);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-right: 1px solid rgba(255, 255, 255, 0.06);
  z-index: 100;
  transform: translateX(-100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.sidebar-header h3 {
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
}

.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.search-bar input {
  flex: 1;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  color: white;
  font-size: 14px;
  outline: none;
  transition: all 0.3s;
}

.search-bar input:focus {
  border-color: #667eea;
}

.search-bar button {
  padding: 10px 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
}

#users {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.user-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 14px;
  padding: 12px;
  margin: 5px 0;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-card:hover {
  background: rgba(102, 126, 234, 0.1);
  border-color: rgba(102, 126, 234, 0.3);
  transform: translateX(3px);
}

.user-card-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.1);
}

.user-card-info {
  flex: 1;
  min-width: 0;
}

.user-card-name {
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-card-status {
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.status-dot.online {
  background: #00ff88;
  box-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
}

.status-dot.typing {
  background: #ffaa00;
  box-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
  animation: pulse 1s infinite;
}

.status-dot.offline {
  background: #555;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.user-card-rating {
  font-size: 12px;
  color: #ffaa00;
  flex-shrink: 0;
}

.sidebar-buttons {
  padding: 10px 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.edit-profile-btn, .logout-btn {
  width: 100%;
  padding: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  color: white;
  cursor: pointer;
  margin-top: 6px;
  transition: all 0.3s;
  font-size: 13px;
  text-align: left;
  padding-left: 14px;
}

.edit-profile-btn:hover {
  background: rgba(255, 255, 255, 0.08);
}

.logout-btn {
  background: rgba(255, 50, 50, 0.08);
  border-color: rgba(255, 50, 50, 0.2);
  color: #ff6b6b;
}

.logout-btn:hover {
  background: rgba(255, 50, 50, 0.15);
}

.sidebar-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  z-index: 99;
  display: none;
}

.sidebar-overlay.show {
  display: block;
}

/* === CHAT AREA === */
.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  background: rgba(8, 8, 18, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.chat-header {
  padding: 12px 15px;
  background: rgba(10, 10, 22, 0.95);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  z-index: 10;
  min-height: 56px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.menu-toggle {
  background: none;
  border: none;
  color: white;
  font-size: 24px;
  cursor: pointer;
  padding: 5px 8px;
  display: flex;
  align-items: center;
  line-height: 1;
  transition: transform 0.2s;
}

.menu-toggle:active {
  transform: scale(0.9);
}

.chat-header-info {
  flex: 1;
  cursor: pointer;
  min-width: 0;
}

.chat-header-title {
  font-weight: 600;
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.global-badge {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  display: inline-block;
  margin-top: 3px;
  letter-spacing: 0.5px;
}

/* === MESSAGES AREA === */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

.msgRow {
  display: flex;
  gap: 6px;
  animation: msgIn 0.3s ease;
  flex-shrink: 0;
}

@keyframes msgIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.msgRow.me {
  justify-content: flex-end;
}

.msgRow.other {
  justify-content: flex-start;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.1);
  transition: all 0.3s;
  flex-shrink: 0;
  margin-top: 2px;
}

.avatar:hover {
  border-color: #667eea;
  transform: scale(1.1);
}

.msg-content-wrapper {
  display: flex;
  flex-direction: column;
  max-width: 70%;
}

.me .msg-content-wrapper {
  align-items: flex-end;
}

.other .msg-content-wrapper {
  align-items: flex-start;
}

.msg {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
  max-width: 100%;
  position: relative;
}

.me .msg {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border-bottom-right-radius: 6px;
}

.other .msg {
  background: rgba(35, 35, 55, 0.9);
  color: #e0e0e0;
  border-bottom-left-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.msg-time {
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  margin-top: 3px;
  padding: 0 4px;
}

.me .msg-time {
  text-align: right;
}

.msg-actions {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 3px;
  flex-wrap: wrap;
}

.delete-btn {
  background: none;
  border: none;
  color: rgba(255, 100, 100, 0.6);
  cursor: pointer;
  font-size: 11px;
  padding: 2px 5px;
  border-radius: 4px;
  transition: all 0.3s;
}

.delete-btn:hover {
  color: #ff4444;
  background: rgba(255, 0, 0, 0.1);
}

.rate-container {
  display: flex;
  align-items: center;
  gap: 2px;
}

.rate-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 15px;
  padding: 2px;
  transition: all 0.2s;
  opacity: 0.4;
  filter: grayscale(0.5);
}

.rate-btn:hover {
  opacity: 1;
  transform: scale(1.3);
  filter: grayscale(0);
}

.rate-btn.rated {
  opacity: 1;
  filter: grayscale(0);
}

.rate-btn:disabled {
  opacity: 0.25;
  cursor: not-allowed;
  filter: grayscale(1);
}

.rated-label {
  font-size: 9px;
  color: #777;
  margin-left: 4px;
}

/* === TYPING INDICATOR === */
.typing-indicator {
  padding: 6px 18px;
  font-size: 11px;
  color: #ffaa00;
  display: none;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  min-height: 22px;
  background: rgba(10, 10, 22, 0.5);
}

.typing-dots {
  display: flex;
  gap: 3px;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  background: #ffaa00;
  border-radius: 50%;
  animation: typingBounce 1.4s infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* === CHAT INPUT (WHATSAPP STYLE) === */
.chat-input-container {
  flex-shrink: 0;
  z-index: 10;
  background: rgba(10, 10, 22, 0.95);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.chat-input-area {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
  min-height: 56px;
}

.chat-input-area input {
  flex: 1;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 28px;
  color: white;
  font-size: 15px;
  outline: none;
  transition: all 0.3s;
  min-width: 0;
  height: 46px;
  line-height: 1.3;
}

.chat-input-area input::placeholder {
  color: #555;
  font-size: 14px;
}

.chat-input-area input:focus {
  border-color: #667eea;
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 20px rgba(102, 126, 234, 0.15);
}

.send-btn {
  width: 46px;
  height: 46px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 50%;
  color: white;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.3s;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
}

.send-btn:active {
  transform: scale(0.9);
  box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
}

.send-icon {
  font-size: 20px;
}

/* === PROFILE POPUP === */
#profilePopup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(20, 20, 40, 0.98);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px;
  padding: 30px;
  z-index: 200;
  min-width: 280px;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
}

#profilePopup img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255, 255, 255, 0.2);
  margin-bottom: 15px;
}

#profilePopup h3 {
  font-size: 20px;
  margin-bottom: 5px;
}

#profilePopup p {
  color: #999;
  margin-bottom: 12px;
  font-size: 13px;
}

.profile-close-btn {
  padding: 10px 30px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  color: white;
  cursor: pointer;
  transition: all 0.3s;
  font-size: 14px;
}

.profile-close-btn:hover {
  background: rgba(255, 255, 255, 0.15);
}

.popup-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(4px);
  z-index: 199;
}

/* === SCROLL TO BOTTOM BUTTON === */
.scroll-bottom-btn {
  position: absolute;
  bottom: 70px;
  right: 15px;
  width: 38px;
  height: 38px;
  background: rgba(30, 30, 50, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  color: white;
  cursor: pointer;
  font-size: 18px;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.scroll-bottom-btn.show {
  display: flex;
}

.scroll-bottom-btn:active {
  transform: scale(0.9);
}

/* === MOBILE === */
@media (max-width: 768px) {
  .msg-content-wrapper {
    max-width: 80%;
  }

  .msg {
    font-size: 13px;
    padding: 8px 12px;
  }

  .chat-input-area {
    padding: 8px 10px;
    min-height: 52px;
  }

  .chat-input-area input {
    font-size: 14px;
    padding: 10px 14px;
    height: 42px;
  }

  .send-btn {
    width: 42px;
    height: 42px;
  }

  .messages {
    padding: 10px;
  }

  .chat-header {
    padding: 8px 12px;
    min-height: 48px;
  }

  .avatar {
    width: 28px;
    height: 28px;
  }
  
  .auth-card {
    padding: 30px 20px;
  }
  
  .auth-card h2 {
    font-size: 26px;
  }
}

@media (max-width: 400px) {
  .msg-content-wrapper {
    max-width: 85%;
  }
  
  .msg {
    font-size: 12px;
    padding: 7px 10px;
  }

  .chat-input-area input {
    font-size: 13px;
    padding: 8px 12px;
    height: 38px;
  }

  .send-btn {
    width: 38px;
    height: 38px;
  }
}

/* === SCROLLBAR === */
::-webkit-scrollbar {
  width: 3px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px;
}

/* iOS Safari fix */
@supports (-webkit-touch-callout: none) {
  body, #app, .sidebar {
    height: -webkit-fill-available;
  }
}
</style>
</head>
<body>

<!-- BACKGROUND ANIMATION -->
<div class="bg-animation">
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-grid"></div>
</div>

<!-- LOGIN PAGE -->
<div id="authPage">
  <div class="auth-card">
    <div class="auth-logo">💬</div>
    <h2>KhawaChat</h2>
    <p class="subtitle">✦ Chat Modern & Aman ✦</p>
    <div class="input-group">
      <span class="input-icon">📧</span>
      <input class="auth-input" id="email" placeholder="Email" type="email" autocomplete="email">
    </div>
    <div class="input-group">
      <span class="input-icon">🔒</span>
      <input class="auth-input" id="password" placeholder="Password" type="password" autocomplete="current-password">
    </div>
    <button class="auth-btn btn-primary" onclick="login()">🚀 Masuk</button>
    <div class="auth-divider"><span>atau</span></div>
    <button class="auth-btn btn-secondary" onclick="register()">📝 Buat Akun Baru</button>
  </div>
</div>

<!-- PROFILE SETUP -->
<div id="profileSetup">
  <div class="profile-card">
    <h2>🎨 Setup Profile</h2>
    <div class="input-group">
      <span class="input-icon">👤</span>
      <input class="auth-input" id="username" placeholder="Username kerenmu" maxlength="20">
    </div>
    <div class="input-group">
      <span class="input-icon">📝</span>
      <input class="auth-input" id="bio" placeholder="Bio singkat" maxlength="100">
    </div>
    <label class="file-upload" id="fileLabel">
      📸 Pilih Foto Profile
      <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="document.getElementById('fileLabel').childNodes[0].textContent=this.files[0]?.name||'📸 Pilih Foto Profile'">
    </label>
    <button class="auth-btn btn-primary" onclick="saveProfile()" style="margin-top:15px">💾 Simpan Profile</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="container">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>💬 Pengguna</h3>
        <div class="search-bar">
          <input id="searchInput" placeholder="🔍 Cari..." oninput="searchUsers()">
          <button onclick="searchUsers()">Cari</button>
        </div>
      </div>
      <div id="users"></div>
      <div class="sidebar-buttons">
        <button class="edit-profile-btn" onclick="editProfile()">✏️ Edit Profile</button>
        <button class="logout-btn" onclick="logout()">🚪 Log Out</button>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat" id="chatContainer">
      <div class="chat-header">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="chat-header-info" onclick="switchToGlobal()">
          <div class="chat-header-title" id="chatTitle">🌍 Global Chat</div>
          <span class="global-badge" id="chatBadge">Global</span>
        </div>
      </div>
      
      <div class="messages" id="messages"></div>
      
      <!-- Scroll to bottom button -->
      <button class="scroll-bottom-btn" id="scrollBottomBtn" onclick="scrollToBottom()">↓</button>
      
      <div class="typing-indicator" id="typingArea">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
        <span id="typingText"></span>
      </div>
      
      <!-- WHATSAPP-STYLE INPUT -->
      <div class="chat-input-container">
        <div class="chat-input-area" id="chatInputArea">
          <input id="msgInput" placeholder="Ketik pesan..." oninput="handleTyping()" onkeypress="if(event.key==='Enter')sendMsg()" autocomplete="off">
          <button class="send-btn" onclick="sendMsg()">
            <span class="send-icon">➤</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PROFILE POPUP -->
<div class="popup-overlay" id="popupOverlay" onclick="closeProfile()"></div>
<div id="profilePopup">
  <img id="pImg" src="https://i.imgur.com/HeIi0wU.png">
  <h3 id="pName"></h3>
  <p id="pBio"></p>
  <p id="pRating"></p>
  <button class="profile-close-btn" onclick="closeProfile()">Tutup</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const appFirebase = initializeApp({
  apiKey:"AIzaSyDxfd_zWhV70QL97ea7a6W4W_BlySxtKLw",
  authDomain:"crowdedparty.firebaseapp.com",
  projectId:"crowdedparty"
});

const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let me = null;
let currentChat = 'global';
let usersCache = {};
let lastSend = 0;
let lastMsgTime = 0;
let typingTimers = {};
let myRatings = {};
let sidebarOpen = false;
let messagesUnsub = null;
let usersUnsub = null;
let isUserNearBottom = true;
let hasNewMessage = false;

Notification.requestPermission();

// === SCROLL DETECTION ===
const messagesEl = document.getElementById('messages');

function checkIfNearBottom() {
  const threshold = 80;
  const scrollBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
  isUserNearBottom = scrollBottom < threshold;
  
  // Update scroll button visibility
  const btn = document.getElementById('scrollBottomBtn');
  if(!isUserNearBottom && messagesEl.scrollHeight > messagesEl.clientHeight + 100) {
    btn.classList.add('show');
  } else {
    btn.classList.remove('show');
  }
}

messagesEl.addEventListener('scroll', checkIfNearBottom);

window.scrollToBottom = () => {
  messagesEl.scrollTo({
    top: messagesEl.scrollHeight,
    behavior: 'smooth'
  });
  document.getElementById('scrollBottomBtn').classList.remove('show');
  isUserNearBottom = true;
};

// === AUTH ===
window.login = () => {
  const emailVal = document.getElementById('email').value.trim();
  const passVal = document.getElementById('password').value;
  if(!emailVal || !passVal) return alert('Email dan password harus diisi!');
  signInWithEmailAndPassword(auth, emailVal, passVal).catch(e => alert('Login gagal: ' + e.message));
};

window.register = () => {
  const emailVal = document.getElementById('email').value.trim();
  const passVal = document.getElementById('password').value;
  if(!emailVal || !passVal) return alert('Email dan password harus diisi!');
  if(passVal.length < 6) return alert('Password minimal 6 karakter!');
  createUserWithEmailAndPassword(auth, emailVal, passVal).catch(e => alert('Register gagal: ' + e.message));
};

window.logout = async () => {
  if(!confirm('Yakin ingin logout?')) return;
  await setOnlineStatus(false);
  if(messagesUnsub) messagesUnsub();
  if(usersUnsub) usersUnsub();
  await signOut(auth);
  currentChat = 'global';
  usersCache = {};
  document.getElementById('app').style.display = 'none';
  document.getElementById('profileSetup').style.display = 'none';
  document.getElementById('authPage').style.display = 'flex';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
  if(sidebarOpen) toggleSidebar();
};

onAuthStateChanged(auth, async u => {
  if(!u) { me = null; return; }
  me = u;
  document.getElementById('authPage').style.display = 'none';
  let snap = await getDoc(doc(db, 'users', u.uid));
  if(!snap.exists()) {
    document.getElementById('profileSetup').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  } else {
    document.getElementById('profileSetup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    setTimeout(() => document.getElementById('msgInput').focus(), 800);
    init();
  }
});

// === HELPERS ===
function fileToBase64(f) {
  return new Promise(r => {
    let rd = new FileReader();
    rd.onload = () => r(rd.result);
    rd.readAsDataURL(f);
  });
}

function escapeHtml(text) {
  if(!text) return '';
  let div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTime(ts) {
  let d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// === PROFILE ===
window.saveProfile = async () => {
  const usernameVal = document.getElementById('username').value.trim();
  if(!usernameVal) return alert('Username wajib diisi!');
  let file = document.getElementById('photoFile').files[0];
  let photo = file ? await fileToBase64(file) : "";
  await setDoc(doc(db, 'users', me.uid), {
    username: usernameVal,
    bio: document.getElementById('bio').value.trim(),
    photo: photo,
    rating: 0,
    totalRate: 0,
    online: true,
    typing: false,
    typingTo: ''
  });
  document.getElementById('profileSetup').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  setTimeout(() => document.getElementById('msgInput').focus(), 500);
  init();
};

window.editProfile = async () => {
  let snap = await getDoc(doc(db, 'users', me.uid));
  let d = snap.data();
  let name = prompt('Username baru:', d.username);
  if(!name || !name.trim()) return;
  let bioo = prompt('Bio baru:', d.bio);
  if(bioo === null) return;
  await updateDoc(doc(db, 'users', me.uid), { username: name.trim(), bio: bioo.trim() });
  await loadUsers();
};

// === INIT ===
async function init() {
  await loadMyRatings();
  await loadUsers();
  loadMsgs();
  setOnlineStatus(true);
  setTimeout(() => document.getElementById('msgInput').focus(), 1000);
}

async function loadMyRatings() {
  let snap = await getDoc(doc(db, 'ratings', me.uid));
  if(snap.exists()) myRatings = snap.data();
}

// === SIDEBAR ===
window.toggleSidebar = () => {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('sidebarOverlay').classList.toggle('show', sidebarOpen);
  if(!sidebarOpen) {
    setTimeout(() => document.getElementById('msgInput').focus(), 300);
  }
};

async function loadUsers(searchTerm = '') {
  let snap = await getDocs(collection(db, 'users'));
  let users = [];
  usersCache = {};
  snap.forEach(d => {
    let data = d.data();
    usersCache[d.id] = data;
    users.push({ id: d.id, ...data });
  });
  users = users.filter(u => u.id !== me.uid);
  if(searchTerm) {
    users = users.filter(u => u.username.toLowerCase().includes(searchTerm.toLowerCase()));
  }
  users.sort((a, b) => {
    if(a.online && !b.online) return -1;
    if(!a.online && b.online) return 1;
    return (b.rating || 0) - (a.rating || 0);
  });

  let html = '';
  users.forEach(u => {
    let statusClass = 'offline';
    let statusText = 'Offline';
    if(u.online) {
      if(u.typing && u.typingTo === me.uid) {
        statusClass = 'typing';
        statusText = 'Mengetik...';
      } else {
        statusClass = 'online';
        statusText = 'Online';
      }
    }
    html += `
    <div class="user-card" onclick="openChat('${u.id}')">
      <img class="user-card-avatar" src="${u.photo || 'https://i.imgur.com/HeIi0wU.png'}" onerror="this.src='https://i.imgur.com/HeIi0wU.png'">
      <div class="user-card-info">
        <div class="user-card-name">${escapeHtml(u.username)}</div>
        <div class="user-card-status">
          <span class="status-dot ${statusClass}"></span>${statusText}
        </div>
      </div>
      <div class="user-card-rating">⭐${(u.rating||0).toFixed(1)}</div>
    </div>`;
  });
  document.getElementById('users').innerHTML = html || '<p style="text-align:center;color:#666;margin-top:20px">Tidak ada pengguna</p>';
}

window.searchUsers = () => loadUsers(document.getElementById('searchInput').value.trim());

// === OPEN CHAT ===
window.openChat = (id) => {
  currentChat = id;
  let user = usersCache[id];
  if(user) {
    document.getElementById('chatTitle').textContent = '💬 ' + user.username;
    document.getElementById('chatBadge').textContent = 'Private';
    document.getElementById('chatBadge').style.background = 'linear-gradient(135deg, #00c853, #69f0ae)';
  }
  loadMsgs();
  toggleSidebar();
  setTimeout(() => document.getElementById('msgInput').focus(), 400);
};

window.switchToGlobal = () => {
  currentChat = 'global';
  document.getElementById('chatTitle').textContent = '🌍 Global Chat';
  document.getElementById('chatBadge').textContent = 'Global';
  document.getElementById('chatBadge').style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
  loadMsgs();
};

// === SEND MESSAGE ===
window.sendMsg = async () => {
  let inputEl = document.getElementById('msgInput');
  if(!inputEl) return;
  let text = inputEl.value.trim();
  if(!text) return;

  let now = Date.now();
  if(currentChat === 'global' && now - lastSend < 12000) {
    alert('⏳ Cooldown 12 detik untuk global chat');
    return;
  }
  lastSend = now;

  try {
    await addDoc(collection(db, 'messages'), {
      text: text,
      uid: me.uid,
      to: currentChat,
      time: now
    });
    inputEl.value = '';
    inputEl.focus();
    // Force user to near bottom when sending
    isUserNearBottom = true;
    await updateDoc(doc(db, 'users', me.uid), { typing: false, typingTo: '' });
  } catch(e) {
    alert('Gagal mengirim pesan: ' + e.message);
  }
};

// === TYPING ===
window.handleTyping = async () => {
  if(currentChat === 'global') return;
  await updateDoc(doc(db, 'users', me.uid), { typing: true, typingTo: currentChat });
  clearTimeout(typingTimers[currentChat]);
  typingTimers[currentChat] = setTimeout(async () => {
    await updateDoc(doc(db, 'users', me.uid), { typing: false, typingTo: '' });
  }, 2000);
};

// === LOAD MESSAGES (SMART SCROLL) ===
function loadMsgs() {
  if(messagesUnsub) messagesUnsub();
  if(usersUnsub) usersUnsub();

  messagesUnsub = onSnapshot(collection(db, 'messages'), snap => {
    let arr = [];
    snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    arr.sort((a, b) => a.time - b.time);

    let html = '';
    arr.forEach(m => {
      if(!usersCache[m.uid]) return;
      if(currentChat === 'global' && m.to !== 'global') return;
      if(currentChat !== 'global' && !(
        (m.uid === me.uid && m.to === currentChat) || 
        (m.uid === currentChat && m.to === me.uid)
      )) return;

      let isMe = m.uid === me.uid;
      let user = usersCache[m.uid];
      let photo = user.photo || "https://i.imgur.com/HeIi0wU.png";

      if(!isMe && m.time > lastMsgTime && document.hidden) {
        try { new Notification(user.username, { body: m.text, icon: photo }); } catch(e) {}
      }
      lastMsgTime = m.time;

      html += `
      <div class="msgRow ${isMe ? 'me' : 'other'}">
        ${!isMe ? `<img src="${photo}" class="avatar" onclick="showProfile('${m.uid}')" onerror="this.src='https://i.imgur.com/HeIi0wU.png'">` : ''}
        <div class="msg-content-wrapper">
          <div class="msg">${escapeHtml(m.text)}</div>
          <div class="msg-time">${formatTime(m.time)}</div>
          <div class="msg-actions">
            ${isMe ? `<button class="delete-btn" onclick="delMsg('${m.id}')">🗑</button>` : ''}
            ${!isMe ? ratingUI(m.uid) : ''}
          </div>
        </div>
        ${isMe ? `<img src="${photo}" class="avatar" onclick="showProfile('${m.uid}')" onerror="this.src='https://i.imgur.com/HeIi0wU.png'">` : ''}
      </div>`;
    });

    // Update messages
    messagesEl.innerHTML = html;
    
    // SMART SCROLL: only auto-scroll if user is near bottom
    if(isUserNearBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    
    // Update scroll button
    checkIfNearBottom();
  });

  // Listen for typing & online status
  usersUnsub = onSnapshot(collection(db, 'users'), snap => {
    let typingUser = null;
    snap.forEach(d => {
      let data = d.data();
      usersCache[d.id] = data;
      if(d.id === currentChat && data.typing && data.typingTo === me.uid) {
        typingUser = data.username;
      }
    });

    let typingArea = document.getElementById('typingArea');
    if(typingUser) {
      typingArea.style.display = 'flex';
      document.getElementById('typingText').textContent = typingUser + ' sedang mengetik...';
    } else {
      typingArea.style.display = 'none';
    }
    
    if(sidebarOpen) loadUsers(document.getElementById('searchInput')?.value || '');
  });
}

// === RATING ===
function ratingUI(uid) {
  let rated = myRatings[uid] || 0;
  let stars = [1,2,3,4,5].map(s => 
    `<button class="rate-btn ${rated >= s ? 'rated' : ''}" 
      onclick="rateUser('${uid}', ${s})" 
      ${rated > 0 ? 'disabled' : ''}>⭐</button>`
  ).join('');
  if(rated > 0) stars += `<span class="rated-label">Done</span>`;
  return `<div class="rate-container">${stars}</div>`;
}

window.rateUser = async (uid, star) => {
  if(myRatings[uid]) return alert('⚠️ Kamu sudah memberikan rating!');
  if(!confirm(`Beri rating ${star}⭐?`)) return;
  let ref = doc(db, 'users', uid);
  let snap = await getDoc(ref);
  let d = snap.data();
  let total = (d.totalRate || 0) + 1;
  let rating = (((d.rating || 0) * (d.totalRate || 0)) + star) / total;
  await updateDoc(ref, { rating, totalRate: total });
  myRatings[uid] = star;
  await setDoc(doc(db, 'ratings', me.uid), myRatings);
  alert('✅ Rating berhasil!');
  loadMsgs();
};

window.delMsg = async (id) => {
  if(!confirm('Hapus pesan?')) return;
  await updateDoc(doc(db, 'messages', id), { text: '[pesan dihapus]' });
};

// === PROFILE POPUP ===
window.showProfile = (id) => {
  let u = usersCache[id];
  if(!u) return;
  document.getElementById('pName').innerText = u.username;
  document.getElementById('pBio').innerText = u.bio || 'Tidak ada bio';
  document.getElementById('pImg').src = u.photo || "https://i.imgur.com/HeIi0wU.png";
  document.getElementById('pImg').onerror = function() { this.src = 'https://i.imgur.com/HeIi0wU.png'; };
  document.getElementById('pRating').innerText = `Rating: ⭐ ${(u.rating || 0).toFixed(1)} (${u.totalRate || 0} votes)`;
  document.getElementById('profilePopup').style.display = 'block';
  document.getElementById('popupOverlay').style.display = 'block';
};

window.closeProfile = () => {
  document.getElementById('profilePopup').style.display = 'none';
  document.getElementById('popupOverlay').style.display = 'none';
};

// === ONLINE STATUS ===
async function setOnlineStatus(status) {
  if(!me) return;
  try {
    await updateDoc(doc(db, 'users', me.uid), { online: status, typing: false, typingTo: '' });
  } catch(e) {}
}

window.addEventListener('beforeunload', () => setOnlineStatus(false));
window.addEventListener('focus', () => { if(me) setOnlineStatus(true); });
window.addEventListener('blur', () => { if(me) setOnlineStatus(false); });
</script>
</body>
</html>
