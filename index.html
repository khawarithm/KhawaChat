<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhawaChat</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:white}
.container{display:flex;height:100vh}
.sidebar{width:30%;background:#111;padding:10px;overflow:auto}
.chat{flex:1;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column}
input,button{padding:10px;border:none;border-radius:8px;margin:5px 0}
button{background:white;color:black;cursor:pointer}
.msgRow{display:flex;margin:5px 0}
.msgRow.me{justify-content:flex-end}
.msgRow.other{justify-content:flex-start}
.msg{padding:10px;border-radius:10px;max-width:60%}
.me .msg{background:white;color:black}
.other .msg{background:#222}
.avatar{width:25px;height:25px;border-radius:50%;margin:0 5px;cursor:pointer}
.user{background:#1a1a1a;padding:8px;margin:5px;border-radius:8px;cursor:pointer}
.delete{font-size:10px;color:red;cursor:pointer}
</style>
</head>
<body><div id="authPage">
<h2>Login</h2>
<input id="email"><br>
<input id="password" type="password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div><div id="profileSetup" style="display:none">
<h2>Profile</h2>
<input id="username" placeholder="Username"><br>
<input type="file" id="photoFile"><br>
<button onclick="saveProfile()">Save</button>
</div><div id="app" style="display:none">
<div class="container">
<div class="sidebar">
<h3>Users</h3>
<button onclick="editProfile()">Edit Profile</button>
<div id="users"></div>
</div>
<div class="chat">
<div id="messages" class="messages"></div>
<input id="msgInput" placeholder="Ketik pesan">
<button onclick="sendMsg()">Send</button>
</div>
</div>
</div><div id="profilePopup" style="display:none;position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#111;padding:20px;border-radius:10px">
<h3 id="pName"></h3>
<img id="pImg" width="80"><br>
<button onclick="closeProfile()">Close</button>
</div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDoc, getDocs, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDxfd_zWhV70QL97ea7a6W4W_BlySxtKLw",
authDomain:"crowdedparty.firebaseapp.com",
projectId:"crowdedparty"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let me=null,chat='global',usersCache={},lastSend=0;

window.login=()=>signInWithEmailAndPassword(auth,email.value,password.value);
window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value);

onAuthStateChanged(auth,async u=>{
if(!u) return;
me=u;
authPage.style.display='none';
let snap=await getDoc(doc(db,'users',u.uid));
if(!snap.exists()) profileSetup.style.display='block';
else{app.style.display='block';init();}
});

function fileToBase64(f){return new Promise(r=>{let rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f);});}

window.saveProfile=async()=>{
let file=photoFile.files[0];
let photo=file?await fileToBase64(file):"";
await setDoc(doc(db,'users',me.uid),{username:username.value,photo:photo});
profileSetup.style.display='none';app.style.display='block';init();
}

window.editProfile=async()=>{
let snap=await getDoc(doc(db,'users',me.uid));
let d=snap.data();
let name=prompt('Username',d.username);
await updateDoc(doc(db,'users',me.uid),{username:name});
loadUsers();
}

async function init(){await loadUsers();loadMsgs();}

async function loadUsers(){
let snap=await getDocs(collection(db,'users'));
let html="";usersCache={};
snap.forEach(d=>{usersCache[d.id]=d.data();html+=`<div class='user' onclick="openChat('${d.id}')">${d.data().username}</div>`});
users.innerHTML=html;
}

window.openChat=id=>{chat=id;loadMsgs();}

window.sendMsg=async()=>{
if(!msgInput.value) return;
let now=Date.now();
if(chat==='global' && now-lastSend<12000){alert('Cooldown 12 detik');return}
lastSend=now;
await addDoc(collection(db,'messages'),{text:msgInput.value,uid:me.uid,to:chat,time:now});
msgInput.value="";
}

function loadMsgs(){
onSnapshot(collection(db,'messages'),snap=>{
let arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));
arr.sort((a,b)=>a.time-b.time);
let html="";
arr.forEach(m=>{
if(!usersCache[m.uid]) return;
if(chat==='global' && m.to!=='global') return;
if(chat!=='global' && !(m.uid===me.uid&&m.to===chat||m.uid===chat&&m.to===me.uid)) return;

let isMe=m.uid===me.uid;
let user=usersCache[m.uid];
let photo=user.photo||"https://i.imgur.com/HeIi0wU.png";

html+=`<div class='msgRow ${isMe?'me':'other'}'>
${!isMe?`<img src='${photo}' class='avatar' onclick="showProfile('${m.uid}')">`:''}
<div>
<div class='msg'>${m.text}</div>
${isMe?`<div class='delete' onclick="delMsg('${m.id}')">hapus</div>`:''}
</div>
${isMe?`<img src='${photo}' class='avatar' onclick="showProfile('${m.uid}')">`:''}
</div>`;
});
messages.innerHTML=html;
messages.scrollTop=messages.scrollHeight;
});
}

window.delMsg=id=>deleteDoc(doc(db,'messages',id));

window.showProfile=id=>{
let u=usersCache[id];
pName.innerText=u.username;
pImg.src=u.photo||"https://i.imgur.com/HeIi0wU.png";
profilePopup.style.display='block';
}

window.closeProfile=()=>profilePopup.style.display='none';

</script></body>
</html>
