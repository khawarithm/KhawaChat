<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KhawaChat - Chat Modern</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: white;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  position: fixed;
  top: 0;
  left: 0;
}

/* LOGIN PAGE */
#authPage {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  padding: 20px;
}

.auth-card {
  background: rgba(24, 24, 36, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 30px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
  animation: fadeInUp 0.6s ease;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.auth-card h2 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.auth-card .subtitle {
  text-align: center;
  color: #999;
  margin-bottom: 25px;
  font-size: 14px;
}

.auth-input {
  width: 100%;
  padding: 14px 18px;
  margin: 8px 0;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: white;
  font-size: 16px;
  transition: all 0.3s;
  outline: none;
}

.auth-input:focus {
  border-color: #667eea;
  box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
  background: rgba(255, 255, 255, 0.08);
}

.auth-input::placeholder {
  color: #666;
}

.auth-btn {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.2);
}

/* PROFILE SETUP */
#profileSetup {
  display: none;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  padding: 20px;
}

.profile-card {
  background: rgba(24, 24, 36, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 30px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
}

.profile-card h2 {
  text-align: center;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.file-upload {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  background: rgba(255, 255, 255, 0.05);
  border: 1px dashed rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  color: #999;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s;
}

.file-upload:hover {
  border-color: #667eea;
  color: #667eea;
}

/* MAIN APP */
#app {
  display: none;
  height: 100vh;
  width: 100vw;
  position: fixed;
  top: 0;
  left: 0;
}

.container {
  display: flex;
  width: 100%;
  height: 100%;
  position: relative;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 320px;
  max-width: 85vw;
  height: 100vh;
  height: 100dvh;
  background: rgba(14, 14, 24, 0.98);
  backdrop-filter: blur(20px);
  border-right: 1px solid rgba(255, 255, 255, 0.05);
  z-index: 100;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.sidebar-header h3 {
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-bar {
  margin: 15px 0;
  display: flex;
  gap: 8px;
}

.search-bar input {
  flex: 1;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  color: white;
  font-size: 14px;
  outline: none;
  transition: all 0.3s;
}

.search-bar input:focus {
  border-color: #667eea;
}

.search-bar button {
  padding: 10px 16px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}

#users {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.user-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 12px;
  margin: 6px 0;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-card:hover {
  background: rgba(102, 126, 234, 0.1);
  border-color: rgba(102, 126, 234, 0.3);
}

.user-card-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
}

.user-card-info {
  flex: 1;
}

.user-card-name {
  font-weight: 600;
  font-size: 14px;
}

.user-card-status {
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.status-dot.online {
  background: #00ff88;
  box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.status-dot.typing {
  background: #ffaa00;
  box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
  animation: pulse 1s infinite;
}

.status-dot.offline {
  background: #555;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.user-card-rating {
  font-size: 12px;
  color: #ffaa00;
}

.edit-profile-btn, .logout-btn {
  width: 100%;
  padding: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  color: white;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.3s;
  font-size: 14px;
}

.edit-profile-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}

.logout-btn {
  background: rgba(255, 50, 50, 0.1);
  border-color: rgba(255, 50, 50, 0.3);
  color: #ff6b6b;
}

.logout-btn:hover {
  background: rgba(255, 50, 50, 0.2);
}

.sidebar-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 99;
  display: none;
}

.sidebar-overlay.show {
  display: block;
}

/* CHAT AREA */
.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  background: rgba(10, 10, 20, 0.8);
}

.chat-header {
  padding: 10px 15px;
  background: rgba(14, 14, 24, 0.95);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(20px);
  flex-shrink: 0;
  z-index: 10;
  min-height: 50px;
}

.menu-toggle {
  background: none;
  border: none;
  color: white;
  font-size: 24px;
  cursor: pointer;
  padding: 5px 8px;
  display: flex;
  align-items: center;
  line-height: 1;
}

.chat-header-info {
  flex: 1;
  cursor: pointer;
  min-width: 0;
}

.chat-header-title {
  font-weight: 600;
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.global-badge {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  display: inline-block;
  margin-top: 2px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  -webkit-overflow-scrolling: touch;
  overflow-anchor: none;
}

.messages-bottom {
  overflow-anchor: auto;
  height: 1px;
}

.msgRow {
  display: flex;
  gap: 6px;
  animation: fadeInUp 0.3s ease;
  flex-shrink: 0;
}

.msgRow.me {
  justify-content: flex-end;
}

.msgRow.other {
  justify-content: flex-start;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.1);
  transition: all 0.3s;
  flex-shrink: 0;
  margin-top: 2px;
}

.avatar:hover {
  border-color: #667eea;
  transform: scale(1.1);
}

.msg-content-wrapper {
  display: flex;
  flex-direction: column;
  max-width: 75%;
}

.me .msg-content-wrapper {
  align-items: flex-end;
}

.other .msg-content-wrapper {
  align-items: flex-start;
}

.msg {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
  max-width: 100%;
}

.me .msg {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border-bottom-right-radius: 4px;
}

.other .msg {
  background: rgba(40, 40, 60, 0.8);
  color: white;
  border-bottom-left-radius: 4px;
}

.msg-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.delete-btn {
  background: none;
  border: none;
  color: rgba(255, 100, 100, 0.7);
  cursor: pointer;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all 0.3s;
}

.delete-btn:hover {
  color: #ff4444;
  background: rgba(255, 0, 0, 0.1);
}

.rate-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  padding: 2px;
  transition: all 0.2s;
  opacity: 0.5;
}

.rate-btn:hover {
  opacity: 1;
  transform: scale(1.2);
}

.rate-btn.rated {
  opacity: 1;
}

.rate-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.rated-label {
  font-size: 9px;
  color: #888;
  margin-left: 4px;
}

.typing-indicator {
  padding: 4px 15px;
  font-size: 12px;
  color: #ffaa00;
  display: none;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  min-height: 20px;
}

.typing-dots {
  display: flex;
  gap: 3px;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  background: #ffaa00;
  border-radius: 50%;
  animation: typingBounce 1.4s infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

.chat-input-area {
  padding: 10px 12px;
  background: rgba(14, 14, 24, 0.95);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
  z-index: 10;
  min-height: 60px;
}

.chat-input-area input {
  flex: 1;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 25px;
  color: white;
  font-size: 16px;
  outline: none;
  transition: all 0.3s;
  min-width: 0;
  height: 44px;
  line-height: 1.2;
}

.chat-input-area input::placeholder {
  color: #666;
  font-size: 14px;
}

.chat-input-area input:focus {
  border-color: #667eea;
  background: rgba(255, 255, 255, 0.08);
}

.send-btn {
  padding: 10px 20px;
  height: 44px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 25px;
  color: white;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
  transition: all 0.3s;
  white-space: nowrap;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.send-btn:active {
  transform: scale(0.95);
}

/* PROFILE POPUP */
#profilePopup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(24, 24, 36, 0.98);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 25px;
  z-index: 200;
  min-width: 280px;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
}

#profilePopup img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255, 255, 255, 0.2);
  margin-bottom: 12px;
}

#profilePopup h3 {
  font-size: 18px;
  margin-bottom: 4px;
}

#profilePopup p {
  color: #999;
  margin-bottom: 12px;
  font-size: 13px;
}

.profile-close-btn {
  padding: 10px 25px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  color: white;
  cursor: pointer;
  transition: all 0.3s;
}

.profile-close-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.popup-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  z-index: 199;
}

/* MOBILE RESPONSIVE */
@media (max-width: 768px) {
  .msg-content-wrapper {
    max-width: 85%;
  }

  .msg {
    font-size: 14px;
    padding: 8px 12px;
  }

  .chat-input-area {
    padding: 8px 10px;
    min-height: 55px;
  }

  .chat-input-area input {
    font-size: 15px;
    padding: 10px 14px;
    height: 40px;
  }

  .send-btn {
    padding: 8px 16px;
    height: 40px;
    font-size: 14px;
  }

  .messages {
    padding: 10px;
  }

  .chat-header {
    padding: 8px 12px;
    min-height: 45px;
  }

  .chat-header-title {
    font-size: 14px;
  }

  .avatar {
    width: 28px;
    height: 28px;
  }
}

@media (max-width: 400px) {
  .msg {
    font-size: 13px;
    padding: 7px 10px;
  }

  .msg-content-wrapper {
    max-width: 85%;
  }

  .avatar {
    width: 26px;
    height: 26px;
  }

  .chat-input-area input {
    font-size: 14px;
    padding: 8px 12px;
    height: 38px;
  }

  .send-btn {
    padding: 6px 14px;
    height: 38px;
    font-size: 13px;
  }
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 3px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
}

/* Fix untuk iOS Safari */
@supports (-webkit-touch-callout: none) {
  body {
    height: -webkit-fill-available;
  }
  
  #app {
    height: -webkit-fill-available;
  }
  
  .sidebar {
    height: -webkit-fill-available;
  }
}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="authPage">
  <div class="auth-card">
    <h2>⚡ KhawaChat</h2>
    <p class="subtitle">Chat Modern & Aman</p>
    <input class="auth-input" id="email" placeholder="Email" type="email" autocomplete="email">
    <input class="auth-input" id="password" placeholder="Password" type="password" autocomplete="current-password">
    <button class="auth-btn btn-primary" onclick="login()">🚀 Login</button>
    <button class="auth-btn btn-secondary" onclick="register()">📝 Register</button>
  </div>
</div>

<!-- PROFILE SETUP -->
<div id="profileSetup">
  <div class="profile-card">
    <h2>🎨 Setup Profile</h2>
    <input class="auth-input" id="username" placeholder="Username kerenmu" maxlength="20">
    <input class="auth-input" id="bio" placeholder="Bio singkat" maxlength="100">
    <label class="file-upload" id="fileLabel">
      📸 Pilih Foto Profile
      <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="document.getElementById('fileLabel').childNodes[0].textContent=this.files[0]?.name||'📸 Pilih Foto Profile'">
    </label>
    <button class="auth-btn btn-primary" onclick="saveProfile()" style="margin-top:15px">💾 Simpan Profile</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="container">
    <!-- SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>💬 Pengguna</h3>
        <div class="search-bar">
          <input id="searchInput" placeholder="🔍 Cari pengguna..." oninput="searchUsers()">
          <button onclick="searchUsers()">Cari</button>
        </div>
        <button class="edit-profile-btn" onclick="editProfile()">✏️ Edit Profile</button>
        <button class="logout-btn" onclick="logout()">🚪 Log Out</button>
      </div>
      <div id="users"></div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat" id="chatContainer">
      <div class="chat-header">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="chat-header-info" onclick="switchToGlobal()">
          <div class="chat-header-title" id="chatTitle">🌍 Global Chat</div>
          <span class="global-badge" id="chatBadge">Global</span>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typingArea">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
        <span id="typingText"></span>
      </div>
      <div class="chat-input-area" id="chatInputArea">
        <input id="msgInput" placeholder="Ketik pesan..." oninput="handleTyping()" onkeypress="if(event.key==='Enter')sendMsg()" autocomplete="off">
        <button class="send-btn" onclick="sendMsg()">Kirim</button>
      </div>
    </div>
  </div>
</div>

<!-- PROFILE POPUP -->
<div class="popup-overlay" id="popupOverlay" onclick="closeProfile()"></div>
<div id="profilePopup">
  <img id="pImg" src="https://i.imgur.com/HeIi0wU.png">
  <h3 id="pName"></h3>
  <p id="pBio"></p>
  <p id="pRating"></p>
  <button class="profile-close-btn" onclick="closeProfile()">Tutup</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const appFirebase = initializeApp({
  apiKey:"AIzaSyDxfd_zWhV70QL97ea7a6W4W_BlySxtKLw",
  authDomain:"crowdedparty.firebaseapp.com",
  projectId:"crowdedparty"
});

const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let me = null;
let currentChat = 'global';
let usersCache = {};
let lastSend = 0;
let lastMsgTime = 0;
let typingTimers = {};
let myRatings = {};
let sidebarOpen = false;
let messagesUnsub = null;
let usersUnsub = null;

// Pastikan input selalu ada
console.log('App loaded, checking elements:');
console.log('msgInput:', document.getElementById('msgInput'));
console.log('sendBtn:', document.querySelector('.send-btn'));

Notification.requestPermission();

// AUTH FUNCTIONS
window.login = () => {
  const emailVal = document.getElementById('email').value.trim();
  const passVal = document.getElementById('password').value;
  if(!emailVal || !passVal) return alert('Email dan password harus diisi!');
  signInWithEmailAndPassword(auth, emailVal, passVal).catch(e => alert('Login gagal: ' + e.message));
};

window.register = () => {
  const emailVal = document.getElementById('email').value.trim();
  const passVal = document.getElementById('password').value;
  if(!emailVal || !passVal) return alert('Email dan password harus diisi!');
  if(passVal.length < 6) return alert('Password minimal 6 karakter!');
  createUserWithEmailAndPassword(auth, emailVal, passVal).catch(e => alert('Register gagal: ' + e.message));
};

window.logout = async () => {
  if(!confirm('Yakin ingin logout?')) return;
  await setOnlineStatus(false);
  
  // Unsub semua listener
  if(messagesUnsub) messagesUnsub();
  if(usersUnsub) usersUnsub();
  
  await signOut(auth);
  currentChat = 'global';
  usersCache = {};
  document.getElementById('app').style.display = 'none';
  document.getElementById('profileSetup').style.display = 'none';
  document.getElementById('authPage').style.display = 'flex';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
  if(sidebarOpen) toggleSidebar();
};

onAuthStateChanged(auth, async u => {
  if(!u) {
    me = null;
    return;
  }
   me = u;
  document.getElementById('authPage').style.display = 'none';

  let snap = await getDoc(doc(db, 'users', u.uid));
  if(!snap.exists()) {
    document.getElementById('profileSetup').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  } else {
    document.getElementById('profileSetup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    
    // Pastikan input visible
    setTimeout(() => {
      document.getElementById('msgInput').focus();
      console.log('Input focused');
    }, 500);
    
    init();
  }
});

// HELPERS
function fileToBase64(f) {
  return new Promise(r => {
    let rd = new FileReader();
    rd.onload = () => r(rd.result);
    rd.readAsDataURL(f);
  });
}

// PROFILE
window.saveProfile = async () => {
  const usernameVal = document.getElementById('username').value.trim();
  if(!usernameVal) return alert('Username wajib diisi!');
  let file = document.getElementById('photoFile').files[0];
  let photo = file ? await fileToBase64(file) : "";
  await setDoc(doc(db, 'users', me.uid), {
    username: usernameVal,
    bio: document.getElementById('bio').value.trim(),
    photo: photo,
    rating: 0,
    totalRate: 0,
    online: true,
    typing: false,
    typingTo: ''
  });
  document.getElementById('profileSetup').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  
  setTimeout(() => {
    document.getElementById('msgInput').focus();
  }, 500);
  
  init();
};

window.editProfile = async () => {
  let snap = await getDoc(doc(db, 'users', me.uid));
  let d = snap.data();
  let name = prompt('Username baru:', d.username);
  if(!name || !name.trim()) return;
  let bioo = prompt('Bio baru:', d.bio);
  if(bioo === null) return;
  await updateDoc(doc(db, 'users', me.uid), {
    username: name.trim(),
    bio: bioo.trim()
  });
  await loadUsers();
};

// INIT
async function init() {
  await loadMyRatings();
  await loadUsers();
  loadMsgs();
  setOnlineStatus(true);
  
  // Focus input
  setTimeout(() => {
    let input = document.getElementById('msgInput');
    if(input) input.focus();
  }, 1000);
}

async function loadMyRatings() {
  let snap = await getDoc(doc(db, 'ratings', me.uid));
  if(snap.exists()) myRatings = snap.data();
}

// SIDEBAR
window.toggleSidebar = () => {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('sidebarOverlay').classList.toggle('show', sidebarOpen);
  
  // Focus input setelah sidebar close
  if(!sidebarOpen) {
    setTimeout(() => {
      document.getElementById('msgInput').focus();
    }, 300);
  }
};

// LOAD USERS
async function loadUsers(searchTerm = '') {
  let snap = await getDocs(collection(db, 'users'));
  let users = [];
  usersCache = {};

  snap.forEach(d => {
    let data = d.data();
    usersCache[d.id] = data;
    users.push({ id: d.id, ...data });
  });

  // Filter & sort
  users = users.filter(u => u.id !== me.uid);
  
  if(searchTerm) {
    users = users.filter(u => 
      u.username.toLowerCase().includes(searchTerm.toLowerCase())
    );
  }
  
  // Sort: online first, then by rating
  users.sort((a, b) => {
    if(a.online && !b.online) return -1;
    if(!a.online && b.online) return 1;
    return (b.rating || 0) - (a.rating || 0);
  });

  let html = '';
  users.forEach(u => {
    let statusClass = 'offline';
    let statusText = 'Offline';
    if(u.online) {
      if(u.typing && u.typingTo === me.uid) {
        statusClass = 'typing';
        statusText = 'Mengetik...';
      } else {
        statusClass = 'online';
        statusText = 'Online';
      }
    }

    html += `
    <div class="user-card" onclick="openChat('${u.id}')">
      <img class="user-card-avatar" src="${u.photo || 'https://i.imgur.com/HeIi0wU.png'}" onerror="this.src='https://i.imgur.com/HeIi0wU.png'">
      <div class="user-card-info">
        <div class="user-card-name">${escapeHtml(u.username)}</div>
        <div class="user-card-status">
          <span class="status-dot ${statusClass}"></span>
          ${statusText}
        </div>
      </div>
      <div class="user-card-rating">⭐ ${(u.rating || 0).toFixed(1)}</div>
    </div>`;
  });

  document.getElementById('users').innerHTML = html || '<p style="text-align:center;color:#666;margin-top:20px">Tidak ada pengguna</p>';
}

window.searchUsers = () => {
  let term = document.getElementById('searchInput').value.trim();
  loadUsers(term);
};

// OPEN CHAT
window.openChat = (id) => {
  currentChat = id;
  let user = usersCache[id];
  if(user) {
    document.getElementById('chatTitle').textContent = '💬 ' + user.username;
    document.getElementById('chatBadge').textContent = 'Private';
    document.getElementById('chatBadge').style.background = 'linear-gradient(135deg, #00c853, #69f0ae)';
  }
  loadMsgs();
  toggleSidebar();
  setTimeout(() => {
    document.getElementById('msgInput').focus();
  }, 400);
};

// Switch to global
window.switchToGlobal = () => {
  currentChat = 'global';
  document.getElementById('chatTitle').textContent = '🌍 Global Chat';
  document.getElementById('chatBadge').textContent = 'Global';
  document.getElementById('chatBadge').style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
  loadMsgs();
};

// SEND MESSAGE
window.sendMsg = async () => {
  let inputEl = document.getElementById('msgInput');
  if(!inputEl) {
    console.error('Input element not found!');
    return;
  }
  
  let text = inputEl.value.trim();
  if(!text) return;

  let now = Date.now();
  if(currentChat === 'global' && now - lastSend < 12000) {
    alert('⏳ Cooldown 12 detik untuk global chat');
    return;
  }
  lastSend = now;

  try {
    await addDoc(collection(db, 'messages'), {
      text: text,
      uid: me.uid,
      to: currentChat,
      time: now
    });

    inputEl.value = '';
    inputEl.focus();
    
    // Update my typing status to false
    await updateDoc(doc(db, 'users', me.uid), { typing: false, typingTo: '' });
  } catch(e) {
    console.error('Send message error:', e);
    alert('Gagal mengirim pesan: ' + e.message);
  }
};

// TYPING
window.handleTyping = async () => {
  if(currentChat === 'global') return;

  await updateDoc(doc(db, 'users', me.uid), { 
    typing: true, 
    typingTo: currentChat 
  });

  clearTimeout(typingTimers[currentChat]);
  typingTimers[currentChat] = setTimeout(async () => {
    await updateDoc(doc(db, 'users', me.uid), { 
      typing: false, 
      typingTo: '' 
    });
  }, 2000);
};

// LOAD MESSAGES
function loadMsgs() {
  // Unsub previous listener
  if(messagesUnsub) messagesUnsub();
  if(usersUnsub) usersUnsub();
  
  messagesUnsub = onSnapshot(collection(db, 'messages'), snap => {
    let arr = [];
    snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    arr.sort((a, b) => a.time - b.time);

    let html = '';
    arr.forEach(m => {
      if(!usersCache[m.uid]) return;
      if(currentChat === 'global' && m.to !== 'global') return;
      if(currentChat !== 'global' && !(
        (m.uid === me.uid && m.to === currentChat) || 
        (m.uid === currentChat && m.to === me.uid)
      )) return;

      let isMe = m.uid === me.uid;
      let user = usersCache[m.uid];
      let photo = user.photo || "https://i.imgur.com/HeIi0wU.png";

      if(!isMe && m.time > lastMsgTime && document.hidden) {
        try {
          new Notification(user.username, { body: m.text, icon: photo });
        } catch(e) {}
      }
      lastMsgTime = m.time;

      html += `
      <div class="msgRow ${isMe ? 'me' : 'other'}">
        ${!isMe ? `<img src="${photo}" class="avatar" onclick="showProfile('${m.uid}')" onerror="this.src='https://i.imgur.com/HeIi0wU.png'">` : ''}
        <div class="msg-content-wrapper">
          <div class="msg">${escapeHtml(m.text)}</div>
          <div class="msg-actions">
            ${isMe ? `<button class="delete-btn" onclick="delMsg('${m.id}')">🗑</button>` : ''}
            ${!isMe ? ratingUI(m.uid) : ''}
          </div>
        </div>
        ${isMe ? `<img src="${photo}" class="avatar" onclick="showProfile('${m.uid}')" onerror="this.src='https://i.imgur.com/HeIi0wU.png'">` : ''}
      </div>`;
    });

    document.getElementById('messages').innerHTML = html;
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  });

  // Listen for typing updates
  usersUnsub = onSnapshot(collection(db, 'users'), snap => {
    let typingUser = null;
    snap.forEach(d => {
      let data = d.data();
      usersCache[d.id] = data;
      if(d.id === currentChat && data.typing && data.typingTo === me.uid) {
        typingUser = data.username;
      }
    });

    let typingArea = document.getElementById('typingArea');
    let typingText = document.getElementById('typingText');
    if(typingUser) {
      typingArea.style.display = 'flex';
      typingText.textContent = typingUser + ' sedang mengetik...';
    } else {
      typingArea.style.display = 'none';
    }

    // Refresh users list if sidebar is open
    if(sidebarOpen) {
      let searchTerm = document.getElementById('searchInput')?.value || '';
      loadUsers(searchTerm);
    }
  });
}

function escapeHtml(text) {
  if(!text) return '';
  let div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// RATING SYSTEM
function ratingUI(uid) {
  let rated = myRatings[uid] || 0;
  let stars = [1,2,3,4,5].map(s => 
    `<button class="rate-btn ${rated >= s ? 'rated' : ''}" 
      onclick="rateUser('${uid}', ${s})" 
      ${rated > 0 ? 'disabled' : ''}>⭐</button>`
  ).join('');
  
  if(rated > 0) {
    stars += `<span class="rated-label">Done</span>`;
  }
  return `<div style="display:flex;align-items:center;gap:2px">${stars}</div>`;
}

window.rateUser = async (uid, star) => {
  if(myRatings[uid]) {
    alert('⚠️ Kamu sudah memberikan rating ke pengguna ini!');
    return;
  }

  if(!confirm(`Beri rating ${star} bintang ke pengguna ini?`)) return;

  let ref = doc(db, 'users', uid);
  let snap = await getDoc(ref);
  let d = snap.data();

  let total = (d.totalRate || 0) + 1;
  let rating = (((d.rating || 0) * (d.totalRate || 0)) + star) / total;

  await updateDoc(ref, { rating, totalRate: total });

  // Save my rating
  myRatings[uid] = star;
  await setDoc(doc(db, 'ratings', me.uid), myRatings);

  alert('✅ Rating berhasil diberikan!');
  loadMsgs();
};

// DELETE MESSAGE
window.delMsg = async (id) => {
  if(!confirm('Hapus pesan ini?')) return;
  await updateDoc(doc(db, 'messages', id), { text: '[pesan dihapus]' });
};

// PROFILE POPUP
window.showProfile = (id) => {
  let u = usersCache[id];
  if(!u) return;
  document.getElementById('pName').innerText = u.username;
  document.getElementById('pBio').innerText = u.bio || 'Tidak ada bio';
  document.getElementById('pImg').src = u.photo || "https://i.imgur.com/HeIi0wU.png";
  document.getElementById('pImg').onerror = function() { this.src = 'https://i.imgur.com/HeIi0wU.png'; };
  document.getElementById('pRating').innerText = `Rating: ⭐ ${(u.rating || 0).toFixed(1)} (${u.totalRate || 0} votes)`;
  document.getElementById('profilePopup').style.display = 'block';
  document.getElementById('popupOverlay').style.display = 'block';
};

window.closeProfile = () => {
  document.getElementById('profilePopup').style.display = 'none';
  document.getElementById('popupOverlay').style.display = 'none';
};

// ONLINE STATUS
async function setOnlineStatus(status) {
  if(!me) return;
  try {
    await updateDoc(doc(db, 'users', me.uid), { 
      online: status,
      typing: false,
      typingTo: ''
    });
  } catch(e) {
    console.log('Status update error:', e);
  }
}

window.addEventListener('beforeunload', () => setOnlineStatus(false));
window.addEventListener('focus', () => { if(me) setOnlineStatus(true); });
window.addEventListener('blur', () => { if(me) setOnlineStatus(false); });

// Pastikan input area tetap terlihat saat keyboard muncul di mobile
window.addEventListener('resize', () => {
  let inputArea = document.getElementById('chatInputArea');
  if(inputArea && document.activeElement === document.getElementById('msgInput')) {
    setTimeout(() => {
      inputArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }, 100);
  }
});

// Fix untuk iOS keyboard
document.addEventListener('focusin', (e) => {
  if(e.target.id === 'msgInput') {
    setTimeout(() => {
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }, 300);
  }
});

</script>
