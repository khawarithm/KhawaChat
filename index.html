<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AxChat - Modern Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BACKGROUND ANIMATION -->
    <div class="bg-animation">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-grid"></div>
    </div>

    <!-- LOGIN PAGE -->
    <div id="authPage">
        <div class="auth-card">
            <div class="auth-logo">💬</div>
            <h2>AxChat</h2>
            <p class="subtitle">✦ Chat Modern & Aman ✦</p>
            <div class="input-group">
                <span class="input-icon">📧</span>
                <input class="auth-input" id="email" placeholder="Email" type="email" autocomplete="email">
            </div>
            <div class="input-group">
                <span class="input-icon">🔒</span>
                <input class="auth-input" id="password" placeholder="Password" type="password" autocomplete="current-password">
            </div>
            <button class="auth-btn btn-primary" id="btnLogin">🚀 Masuk</button>
            <div class="auth-divider"><span>atau</span></div>
            <button class="auth-btn btn-secondary" id="btnRegister">📝 Buat Akun Baru</button>
        </div>
    </div>

    <!-- PROFILE SETUP -->
    <div id="profileSetup">
        <div class="profile-card">
            <h2>🎨 Setup Profile</h2>
            <div class="input-group">
                <span class="input-icon">👤</span>
                <input class="auth-input" id="username" placeholder="Username kerenmu" maxlength="20">
            </div>
            <div class="input-group">
                <span class="input-icon">📝</span>
                <input class="auth-input" id="bio" placeholder="Bio singkat" maxlength="100">
            </div>
            <label class="file-upload" id="fileLabel">
                📸 Pilih Foto Profile
                <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="document.getElementById('fileLabel').childNodes[0].textContent=this.files[0]?.name||'📸 Pilih Foto Profile'">
            </label>
            <button class="auth-btn btn-primary" id="btnSaveProfile" style="margin-top:15px">💾 Simpan Profile</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <div class="container">
            <div class="sidebar-overlay" id="sidebarOverlay"></div>

            <!-- SIDEBAR -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>💬 Pengguna</h3>
                    <div class="search-bar">
                        <input id="searchInput" placeholder="🔍 Cari...">
                        <button id="btnSearch">Cari</button>
                    </div>
                </div>
                <div id="users"></div>
                <div class="sidebar-buttons">
                    <button class="edit-profile-btn" id="btnEditProfile">✏️ Edit Profile</button>
                    <button class="logout-btn" id="btnLogout">🚪 Log Out</button>
                </div>
            </div>

            <!-- CHAT AREA -->
            <div class="chat" id="chatContainer">
                <div class="chat-header">
                    <button class="menu-toggle" id="btnMenuToggle">☰</button>
                    <div class="chat-header-info" id="chatHeaderInfo">
                        <div class="chat-header-title" id="chatTitle">🌍 Global Chat</div>
                        <span class="global-badge" id="chatBadge">Global</span>
                    </div>
                </div>

                <div class="messages" id="messages"></div>

                <button class="scroll-bottom-btn" id="scrollBottomBtn">↓</button>

                <div class="typing-indicator" id="typingArea">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <span id="typingText"></span>
                </div>

                <!-- CHAT INPUT - FIXED & SOLID -->
                <div class="chat-input-container">
                    <div class="chat-input-area">
                        <div class="input-wrapper">
                            <textarea id="msgInput" placeholder="Ketik pesan..." rows="1" autocomplete="off"></textarea>
                        </div>
                        <button class="send-btn" id="btnSend">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PROFILE POPUP -->
    <div class="popup-overlay" id="popupOverlay"></div>
    <div id="profilePopup">
        <img id="pImg" src="https://i.imgur.com/HeIi0wU.png">
        <h3 id="pName"></h3>
        <p id="pBio"></p>
        <p id="pRating"></p>
        <button class="profile-close-btn" id="btnCloseProfile">Tutup</button>
    </div>

    <!-- CUSTOM MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <p id="modalMessage"></p>
            <div class="modal-buttons" id="modalButtons">
                <button class="modal-btn modal-btn-cancel" id="modalCancel">Batal</button>
                <button class="modal-btn modal-btn-ok" id="modalOk">OK</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- EDIT PROFILE MODAL -->
    <div class="modal-overlay" id="editProfileModal">
        <div class="modal-box">
            <h3>✏️ Edit Profile</h3>
            <div class="input-group">
                <input class="auth-input" id="editUsername" placeholder="Username">
            </div>
            <div class="input-group">
                <input class="auth-input" id="editBio" placeholder="Bio">
            </div>
            <div class="file-upload" id="editFileLabel">
                📸 Ganti Foto Profile
                <input type="file" id="editPhotoFile" accept="image/*" style="display:none">
            </div>
            <div class="modal-buttons" style="margin-top:15px">
                <button class="modal-btn modal-btn-cancel" id="cancelEditProfile">Batal</button>
                <button class="modal-btn modal-btn-ok" id="saveEditProfile">Simpan</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
